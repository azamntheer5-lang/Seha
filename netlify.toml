# Netlify deployment configuration for the Seha (Sick Leave Enquiry) app.
# The official Next.js runtime plugin is installed automatically by Netlify
# for Next.js sites, but declaring it here makes the setup explicit.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─────────────────────────────────────────────────────────────────────────────
# SUPABASE (recommended durable storage)
#
# When BOTH variables below are present, the API routes store sick leaves in
# your Supabase project (shared by every serverless instance — saves never get
# lost, verification works from any instance):
#
#   SUPABASE_URL           https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_KEY   secret key or legacy service-role JWT (Settings → API Keys)
#
# ⚠ Set them in the Netlify UI (Site configuration → Environment variables),
# NOT in this file — this repository is public and secrets must never be
# committed. Create the tables once with supabase/schema.sql (SQL editor).
#
# Without them the app still works through the bundled SQLite (demo seeds +
# per-instance writes mirrored to Netlify Blobs) — see src/lib/seha/store.ts.
# ─────────────────────────────────────────────────────────────────────────────

[build.environment]
  NODE_VERSION = "20"
  # Relative SQLite path — resolved against prisma/schema.prisma.
  DATABASE_URL = "file:../db/custom.db"

# Runtime environment for the serverless API functions (production + previews).
[context.production.environment]
  DATABASE_URL = "file:../db/custom.db"

[context.deploy-preview.environment]
  DATABASE_URL = "file:../db/custom.db"

# Belt-and-suspenders: guarantee the SQLite DB + generated Prisma client
# (query engines) are packaged inside every serverless function bundle.
[functions]
  included_files = ["db/custom.db", "node_modules/.prisma/**"]
