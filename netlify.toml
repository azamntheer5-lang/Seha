# Netlify deployment configuration for the Seha (Sick Leave Enquiry) app.
# The official Next.js runtime plugin is installed automatically by Netlify
# for Next.js sites, but declaring it here makes the setup explicit.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Relative SQLite path — resolved against prisma/schema.prisma.
  DATABASE_URL = "file:../db/custom.db"

# Runtime environment for the serverless API functions (production + previews).
[context.production.environment]
  DATABASE_URL = "file:../db/custom.db"

[context.deploy-preview.environment]
  DATABASE_URL = "file:../db/custom.db"

# Belt-and-suspenders: guarantee the SQLite DB + generated Prisma client
# (query engines) are packaged inside every serverless function bundle.
[functions]
  included_files = ["db/custom.db", "node_modules/.prisma/**"]
