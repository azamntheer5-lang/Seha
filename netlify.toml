# Netlify deployment configuration for the Seha (Sick Leave Enquiry) app.
# The official Next.js runtime plugin is installed automatically by Netlify
# for Next.js sites, but declaring it here makes the setup explicit.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ─────────────────────────────────────────────────────────────────────────────
# SUPABASE — ACTIVE durable cloud storage
#
# The project's tables (sick_leaves + inquiry_logs, RLS-locked, 8 seed rows)
# were created with supabase/schema.sql. With both variables below present,
# every API route stores sick leaves in this shared cloud database: saves
# never get lost, verification works from any serverless instance, and every
# device (local dev + Netlify) sees the same records instantly.
#
# NOTE: SUPABASE_SERVICE_KEY is the project's SECRET key, base64-encoded
# (`printf %s 'sb_secret_…' | base64`) because GitHub push protection
# blocks pushes that contain the raw sb_secret_ pattern in this public
# repository — src/lib/seha/store.ts decodes it at runtime (raw keys are
# accepted too). To rotate: create a fresh key in the Supabase dashboard
# and paste its base64 here, then redeploy. If you prefer keeping the key
# out of the repo entirely: put both values in the Netlify UI (Site
# configuration → Environment variables) and remove them from here.
# ─────────────────────────────────────────────────────────────────────────────

[build.environment]
  # Node 24 — Netlify's current default for new sites (Node 20 reached EOL
  # in April 2026 and is no longer provisioned, which fails new builds).
  NODE_VERSION = "24"
  # Relative SQLite path — resolved against prisma/schema.prisma.
  DATABASE_URL = "file:../db/custom.db"

# Runtime environment for the serverless API functions (production + previews).
# SUPABASE_* activates the durable cloud store — see src/lib/seha/store.ts.
[context.production.environment]
  DATABASE_URL = "file:../db/custom.db"
  SUPABASE_URL = "https://bliznhxqefqjehtefqli.supabase.co"
  SUPABASE_SERVICE_KEY = "c2Jfc2VjcmV0X0NKLXk4Wk1IcGdLeW9haWh0MjhQdFFfdnpoUzZ6YVE="

[context.deploy-preview.environment]
  DATABASE_URL = "file:../db/custom.db"
  SUPABASE_URL = "https://bliznhxqefqjehtefqli.supabase.co"
  SUPABASE_SERVICE_KEY = "c2Jfc2VjcmV0X0NKLXk4Wk1IcGdLeW9haWh0MjhQdFFfdnpoUzZ6YVE="

# Belt-and-suspenders: guarantee the SQLite DB + generated Prisma client
# (query engines) are packaged inside every serverless function bundle.
[functions]
  included_files = ["db/custom.db", "node_modules/.prisma/**"]
