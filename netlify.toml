# Netlify deployment configuration for the Seha (Sick Leave Enquiry) app.
# The official Next.js runtime plugin is installed automatically by Netlify
# for Next.js sites, but declaring it here makes the setup explicit.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# TEMPORARY diagnostics plugin (local, from this repo): captures the real
# build error inside the Netlify build container and posts it to Supabase
# (inquiry_logs, service_code DIAG-*) because the API does not expose build
# logs. Remove once the recurring "exit code 2" failure is root-caused.
[[plugins]]
  package = "/plugins/build-diagnostics"

# ─────────────────────────────────────────────────────────────────────────────
# SUPABASE — ACTIVE durable cloud storage
#
# The project's tables (sick_leaves + inquiry_logs, RLS-locked, 8 seed rows)
# were created with supabase/schema.sql. With both SUPABASE_URL and
# SUPABASE_SERVICE_KEY present, every API route stores sick leaves in this
# shared cloud database: saves never get lost, verification works from any
# serverless instance, and every device (local dev + Netlify) sees the same
# records instantly.
#
# ⚠⚠ THE SECRET KEY MUST NEVER LIVE IN THIS FILE ⚠⚠
# Netlify's post-build SECRETS SCANNER inspects every file that gets traced
# into the serverless bundle — including netlify.toml itself — and FAILS the
# whole build ("Secrets scanning found secrets in build", exit code 2) when
# it finds a real Supabase URL or key value in ANY line, even inside
# comments. The values are therefore set as site-level ENVIRONMENT VARIABLES
# in the Netlify UI (Site configuration → Environment variables — or via
# `netlify env:set`), which are injected at build+runtime and are NOT files,
# so they are never scanned:
#
#   SUPABASE_URL          https://<project-ref>.supabase.co   ← your project URL
#   SUPABASE_SERVICE_KEY  the project's SECRET key (sb_secret_… or legacy
#                         service-role JWT; raw form, no base64 needed —
#                         src/lib/seha/store.ts accepts both)
#
# Do NOT paste real values back into this file, README.md or any other
# tracked file: the scanner bundles and inspects them all.
# ─────────────────────────────────────────────────────────────────────────────

[build.environment]
  # Node 24 — Netlify's current default for new sites (Node 20 reached EOL
  # in April 2026 and is no longer provisioned, which fails new builds).
  NODE_VERSION = "24"
  # Relative SQLite path — resolved against prisma/schema.prisma.
  DATABASE_URL = "file:../db/custom.db"

# Runtime environment for the serverless API functions (production + previews).
# SUPABASE_* comes from the Netlify UI env vars — see the big warning above.
[context.production.environment]
  DATABASE_URL = "file:../db/custom.db"

[context.deploy-preview.environment]
  DATABASE_URL = "file:../db/custom.db"

# Belt-and-suspenders: guarantee the SQLite DB + generated Prisma client
# (query engines) are packaged inside every serverless function bundle.
[functions]
  included_files = ["db/custom.db", "node_modules/.prisma/**"]
